name: Build DiCoy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Matrix: rootless (Dopamine / palera1n rootless) + rootful (checkra1n etc.)
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rootless
            scheme: rootless
          - label: rootful
            scheme: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Download iPhoneOS16.5.sdk
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm *.tar.xz

      - name: Build (${{ matrix.label }})
        run: |
          make clean 2>/dev/null || true
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk \
            TARGET="iphone:clang:16.5:15.0" \
            ARCHS="arm64 arm64e" \
            2>&1 | tee build-${{ matrix.label }}.log
          exit ${PIPESTATUS[0]}

      - name: Stage debs
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            base=$(basename "$f" .deb)
            cp "$f" "dist/${base}_${{ matrix.label }}.deb"
          done < <(find packages -name "*.deb" -type f)

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: DiCoy-${{ matrix.label }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: build-${{ matrix.label }}.log

  # -----------------------------------------------------------------------
  # Create a draft GitHub Release with both debs when a version tag is pushed
  # -----------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: DiCoy-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DiCoy ${{ github.ref_name }}
          draft: true
          files: release-artifacts/*.deb
          body: |
            ## Installation

            Download the `.deb` that matches your jailbreak and install it via your package manager (Sileo, Zebra) or Filza.

            | File | iOS | Jailbreak |
            |------|-----|-----------|
            | `*_iphoneos-arm64_rootless.deb` | 15.0 – 17.0 | Dopamine 2.x · palera1n rootless · RootHide |
            | `*_iphoneos-arm_rootful.deb` | 15.0 – 17.0 | checkra1n · unc0ver · palera1n rootful |

            Both packages require **MobileSubstrate / ElleKit** and **PreferenceLoader**.

            After installation the daemon starts automatically. Open **Settings → DiCoy** to configure the injection mode.

            > Changing the **Frame Rate** setting requires restarting the target app to take effect.
