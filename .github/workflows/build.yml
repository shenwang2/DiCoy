name: Build DiCoy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Matrix: rootless (Dopamine / palera1n rootless) + rootful (checkra1n etc.)
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rootless
            scheme: rootless
          - label: rootful
            scheme: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Download iPhoneOS16.5.sdk
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm *.tar.xz

      - name: Build and install libSandy
        run: |
          cd libSandy-main
          make clean 2>/dev/null || true
          make \
            FINALPACKAGE=1 \
            ONLY_LIBRARY=1 \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk \
            TARGET="iphone:clang:16.5:15.0" \
            ARCHS="arm64 arm64e"
          DYLIB=$(find .theos/obj -name "libsandy.dylib" -type f | head -1)
          if [[ "${{ matrix.scheme }}" == "rootless" ]]; then
            mkdir -p $THEOS/lib/iphone/rootless
            cp "$DYLIB" $THEOS/lib/iphone/rootless/libsandy.dylib
          else
            cp "$DYLIB" $THEOS/lib/libsandy.dylib
          fi
          cp libSandy.h $THEOS/include/

      - name: Build (${{ matrix.label }})
        run: |
          make clean 2>/dev/null || true
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk \
            TARGET="iphone:clang:16.5:15.0" \
            ARCHS="arm64 arm64e" \
            2>&1 | tee build-${{ matrix.label }}.log
          exit ${PIPESTATUS[0]}

      - name: Stage debs
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            base=$(basename "$f" .deb)
            cp "$f" "dist/${base}_${{ matrix.label }}.deb"
          done < <(find packages -name "*.deb" -type f)

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: DiCoy-${{ matrix.label }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: build-${{ matrix.label }}.log

  # -----------------------------------------------------------------------
  # Publish a GitHub Release on every push to main/master (not PRs).
  # The version in the control file is used as the tag; pushing the same
  # version updates the existing release in place.
  # -----------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -i '^Version:' control | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: DiCoy-*
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DiCoy v${{ steps.ver.outputs.version }}
          draft: true
          files: release-artifacts/*.deb
          body: |
            ## Installation

            Download the `.deb` that matches your jailbreak and install via your package manager (Sileo, Zebra) or Filza.

            | File | iOS | Jailbreak |
            |------|-----|-----------|
            | `*_iphoneos-arm64_rootless.deb` | 15.0 – 17.0 | Dopamine 2.x · palera1n rootless · RootHide |
            | `*_iphoneos-arm_rootful.deb` | 15.0 – 17.0 | checkra1n · unc0ver · palera1n rootful |

            Both packages require **MobileSubstrate / ElleKit**, **PreferenceLoader**, and **libSandy** (`com.opa334.libsandy` — available on the Havoc and Chariz repos). Your package manager will install it automatically.

            After installation the daemon starts automatically. Open **Settings → DiCoy** to configure the injection mode.

            > Changing the **Frame Rate** setting requires restarting the target app to take effect.
