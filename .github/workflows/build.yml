name: Build DiCoy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Matrix: rootless (Dopamine / palera1n rootless) + rootful (checkra1n etc.)
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rootless
            scheme: rootless
          - label: rootful
            scheme: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Download iPhoneOS16.5.sdk
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm *.tar.xz

      - name: Build (${{ matrix.label }})
        run: |
          make clean 2>/dev/null || true
          make package \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk \
            TARGET="iphone:clang:16.5:15.0" \
            ARCHS="arm64 arm64e" \
            2>&1 | tee build-${{ matrix.label }}.log
          exit ${PIPESTATUS[0]}

      - name: Stage debs
        run: |
          mkdir -p dist
          for f in packages/*.deb; do
            [[ -f "$f" ]] || continue
            base=$(basename "$f" .deb)
            cp "$f" "dist/${base}_${{ matrix.label }}.deb"
          done

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: DiCoy-${{ matrix.label }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.label }}
          path: build-${{ matrix.label }}.log

  # -----------------------------------------------------------------------
  # Create a GitHub Release with both debs when a version tag is pushed
  # -----------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: DiCoy-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.deb
          generate_release_notes: true
